<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
		<title>GlassGuard - Clickjacking Simulator</title>
		<link rel="icon" type="image/png" href="">
		<style>
			:root {
			--accent: #C6ECE3;
			--accent-glow: rgba(198, 236, 227, 0.25);
			--accent-hover: #b4dfd5;
			--bg: #262626;
			--panel: #1f1f1f;
			--section: #2b2b2b;
			--input-bg: #181818;
			--border: rgba(198, 236, 227, 0.15);
			--border-hover: rgba(198, 236, 227, 0.4);
			--log-success: #34d399;
			--log-warning: #f87171;
			--log-info: #C6ECE3;
			}
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			body {
				background-color: var(--bg);
				font-family: "JetBrains Mono", Consolas, monospace;
				color: #f1f1f1;
				display: flex;
				height: 100vh;
				overflow: hidden;
				padding: 20px;
				gap: 20px;
			}
			::-webkit-scrollbar {
				width: 6px;
				height: 6px;
			}
			::-webkit-scrollbar-track {
				background: transparent;
			}
			::-webkit-scrollbar-thumb {
				background: #3f3f3f;
				border-radius: 4px;
			}
			::-webkit-scrollbar-thumb:hover {
				background: var(--accent);
			}
			.panel {
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: 18px;
				padding: 22px;
				width: 360px;
				display: flex;
				flex-direction: column;
				gap: 14px;
				height: calc(100vh - 40px);
				overflow-y: auto;
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
				backdrop-filter: blur(10px);
			}
			.header {
				display: flex;
				align-items: center;
				gap: 14px;
				padding-bottom: 8px;
				border-bottom: 1px solid var(--border);
			}
			.icon img {
				width: 62px;
				height: 62px;
				object-fit: contain;
				border: none;
				background: transparent;
				filter: drop-shadow(0 0 8px rgba(198, 236, 227, 0.65)) drop-shadow(0 0 18px rgba(198, 236, 227, 0.35));
				transition: filter 0.3s ease, transform 0.3s ease;
			}
			.icon img:hover {
				transform: scale(1.06);
				filter: drop-shadow(0 0 12px rgba(198, 236, 227, 0.9)) drop-shadow(0 0 24px rgba(198, 236, 227, 0.5));
			}
			.brand-text {
				display: flex;
				flex-direction: column;
				gap: 2px;
			}
			.title {
				font-weight: 700;
				font-size: 15px;
				color: var(--accent);
				letter-spacing: 0.3px;
			}
			.subtitle {
				font-size: 11px;
				color: #8c8c8c;
			}
			.section {
				background: var(--section);
				border: 1px solid var(--border);
				padding: 13px 15px;
				border-radius: 12px;
				display: flex;
				flex-direction: column;
				gap: 8px;
				transition: border-color 0.2s ease, box-shadow 0.2s ease;
			}
			.section:hover {
				border-color: var(--border-hover);
			}
			.section label {
				font-size: 11px;
				font-weight: 600;
				color: #9c9c9c;
				text-transform: uppercase;
				letter-spacing: 0.6px;
			}
			input[type="text"], input[type="number"] {
				background: var(--input-bg);
				border: 1px solid rgba(255, 255, 255, 0.08);
				color: #f1f1f1;
				padding: 9px 12px;
				border-radius: 8px;
				width: 100%;
				font-family: inherit;
				font-size: 12px;
				outline: none;
				transition: border-color 0.2s ease, box-shadow 0.2s ease;
			}
			input[type="text"]:focus, input[type="number"]:focus {
				border-color: var(--accent);
				box-shadow: 0 0 10px var(--accent-glow);
			}
			.row {
				display: flex;
				gap: 10px;
				align-items: center;
			}
			.row > div {
				flex: 1;
			}
			input[type="range"] {
				width: 100%;
				background: #383838;
				height: 5px;
				border-radius: 3px;
				outline: none;
			}
			input[type="range"]::-webkit-slider-thumb {
				-webkit-appearance: none;
				width: 15px;
				height: 15px;
				border-radius: 50%;
				background: var(--accent);
				cursor: pointer;
				box-shadow: none;
				border: none;
				transition: transform 0.15s ease;
			}
			input[type="range"]::-webkit-slider-thumb:hover {
				transform: scale(1.15);
			}
			input[type="range"]::-moz-range-thumb {
				width: 15px;
				height: 15px;
				border-radius: 50%;
				background: var(--accent);
				cursor: pointer;
				box-shadow: none;
				border: none;
			}
			button {
				padding: 10px 14px;
				border-radius: 8px;
				border: none;
				font-weight: 700;
				font-size: 12px;
				cursor: pointer;
				background-color: var(--accent);
				color: #262626;
				transition: all 0.2s ease;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 6px;
			}
			button:hover {
				background-color: var(--accent-hover);
				box-shadow: 0 0 12px var(--accent-glow);
				transform: translateY(-1px);
			}
			button.secondary {
				background: #333333;
				color: #f1f1f1;
				border: 1px solid var(--border);
			}
			button.secondary:hover {
				background: #424242;
				border-color: var(--accent);
				color: var(--accent);
				box-shadow: none;
			}
			.log {
				background: var(--input-bg);
				border: 1px solid var(--border);
				border-radius: 8px;
				padding: 11px;
				font-size: 11px;
				height: 140px;
				overflow-y: auto;
				display: flex;
				flex-direction: column;
				gap: 5px;
			}
			.log div {
				word-break: break-all;
				line-height: 1.4;
			}
			.success { color: var(--log-success); }
			.warning { color: var(--log-warning); }
			.info { color: var(--log-info); }
			.stage {
				flex: 1;
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: 18px;
				height: calc(100vh - 40px);
				position: relative;
				overflow: hidden;
				display: flex;
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
			}
			.stage-header {
				position: absolute;
				top: 14px;
				left: 18px;
				z-index: 10;
				background: rgba(31, 31, 31, 0.85);
				padding: 6px 14px;
				border-radius: 20px;
				border: 1px solid var(--border);
				font-size: 11px;
				color: var(--accent);
				pointer-events: none;
				backdrop-filter: blur(8px);
			}
			#frameWrapper {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				z-index: 1;
				transition: opacity 0.15s ease;
			}
			iframe {
				width: 100%;
				height: 100%;
				border: none;
				border-radius: 18px;
			}
			#decoyLayer {
				position: absolute;
				z-index: 2;
				pointer-events: none;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
			}
			#decoyButton {
				position: absolute;
				top: 180px;
				left: 250px;
				background: linear-gradient(135deg, #ef4444, #dc2626);
				color: #ffffff;
				padding: 14px 28px;
				border-radius: 10px;
				font-family: Arial, Helvetica, sans-serif;
				font-size: 14px;
				font-weight: 800;
				box-shadow: 0 6px 20px rgba(239, 68, 68, 0.45);
				border: 2px dashed rgba(255, 255, 255, 0.85);
				cursor: pointer;
				user-select: none;
				letter-spacing: 0.5px;
				transition: transform 0.1s ease;
			}
			.notes, .social {
				font-size: 11px;
				color: #8c8c8c;
				line-height: 1.5;
			}
			.social a {
				color: var(--accent);
				text-decoration: none;
				font-weight: 600;
			}
			.social a:hover {
				text-decoration: underline;
			}
		</style>
	</head>
